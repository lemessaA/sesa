# Local MongoDB + optional Qdrant for RAG — run: docker compose up -d
# Qdrant: set QDRANT_URL=http://127.0.0.1:6333 in python-agents/.env
services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: sesa-qdrant-local
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - sesa_qdrant_data:/qdrant/storage

  mongo:
    image: mongo:7
    container_name: sesa-mongo-local
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - sesa_mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: sesa_db

volumes:
  sesa_mongo_data:
  sesa_qdrant_data:
