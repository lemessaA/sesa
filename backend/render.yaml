services:
  - type: web
    name: sesa-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm run render-build
    startCommand: npm run render-start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: true
    scaling:
      minInstances: 1
      maxInstances: 1